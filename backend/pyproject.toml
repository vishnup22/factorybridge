[project]
name = "factorybridge-backend"
version = "0.1.0"
description = "FactoryBridge API and worker: manufacturing change intelligence (synthetic demo)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "pypdf>=5.1",
  "python-multipart>=0.0.18",
  "httpx>=0.28",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "fpdf2>=2.8",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "B008", "S105", "S106", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
  "integration: requires PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]
